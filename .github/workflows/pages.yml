name: Validate and release Super Φιλόλογος

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify game inventory and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, re
          html = Path("index.html").read_text(encoding="utf-8")
          version = Path("VERSION").read_text(encoding="utf-8").strip()
          assert re.fullmatch(r"[0-9]+\.[0-9]+(?:\.[0-9]+)?", version), version
          assert "<title>Super Φιλόλογος" in html and f"v{version}" in html
          assert "function drawLandscape" in html and "function difficultyBand" in html
          assert " • χωρίς δυϊκό" not in html
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert len(scripts) == 1
          Path("/tmp/super-philos-game.js").write_text(scripts[0], encoding="utf-8")
          with Path("morphology_audit.csv").open(encoding="utf-8-sig", newline="") as f:
              entries = list(csv.DictReader(f, delimiter=";"))
          assert len(entries) == 956, len(entries)
          assert not any(r.get("number") == "δυϊκός" for r in entries)
          print(f"Validated Super Φιλόλογος v{version} and {len(entries)} morphological entries.")
          PY
          node --check /tmp/super-philos-game.js
          node tests/smoke.mjs

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          zip -9 "Super_Philos_v${version}_complete.zip" index.html README.md RELEASE_NOTES.md PHILOLOGICAL_AUDIT.md morphology_audit.csv VERSION tests/smoke.mjs

      - name: Publish GitHub Release and version tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="v$(cat VERSION)"
          archive="Super_Philos_${version}_complete.zip"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "::notice::Release $version already exists; bump VERSION and update RELEASE_NOTES.md before publishing a new version."
          else
            gh release create "$version" "$archive" --target "$GITHUB_SHA" --title "Super Φιλόλογος $version" --notes-file RELEASE_NOTES.md --latest
          fi
